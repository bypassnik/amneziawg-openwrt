name: Reusable - Build AmneziaWG packages
# Touch: re-register workflow after enabling Actions

# Compiles amneziawg-tools, amneziawg-go and kmod-amneziawg for one OpenWrt
# target/subtarget using the official SDK and uploads renamed .ipk/.apk files.

"on":
  workflow_call:
    inputs:
      openwrt_version:
        description: "OpenWrt release such as 24.10.8 or 25.12.5"
        type: string
        required: true
      amneziawg_version:
        description: "Release tag, branch or commit hash to build"
        type: string
        required: true
      openwrt_target:
        description: "OpenWrt target"
        type: string
        required: true
      openwrt_subtarget:
        description: "OpenWrt subtarget"
        type: string
        required: true
      artifact_prefix:
        description: "Prefix of the produced artifact name"
        type: string
        required: false
        default: "amneziawg"

jobs:
  build:
    name: "${{ inputs.openwrt_version }} ${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}"
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: amneziawg
          ref: ${{ inputs.amneziawg_version }}
          fetch-depth: 0

      - name: Checkout OpenWrt packages (golang for 24.10)
        if: ${{ startsWith(inputs.openwrt_version, '24.10') }}
        uses: actions/checkout@v5
        with:
          path: packages
          repository: openwrt/packages
          fetch-depth: 1

      - name: Install additional packages
        run: |
          set -e -x
          sudo apt-get update
          sudo apt-get install -y python3-pyelftools python3-dev python3-setuptools swig

      - name: Download and prepare SDK
        run: |
          set -e -x
          base_url="https://downloads.openwrt.org/releases/${{ inputs.openwrt_version }}/targets/${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}/"
          sdk_url=$(curl -s "${base_url}" | grep -oP 'href="openwrt-sdk[^"]+\.tar\.(zst|xz)"' | sed -e 's/href="//' -e 's/"$//' | head -n1)
          if [[ -z "$sdk_url" ]]; then
            echo "SDK file not found at ${base_url}"
            exit 1
          fi
          curl -fsLO "$base_url$sdk_url"
          file_name=$(basename "$sdk_url")
          tar -xf "$file_name"
          rm -f *.tar.zst *.tar.xz
          mv openwrt-sdk* openwrt

          echo "src-cpy awgopenwrt ../amneziawg" >> openwrt/feeds.conf.default
          ./openwrt/scripts/feeds update -a
          curl -fsL "$base_url/config.buildinfo" > openwrt/.config
          echo "CONFIG_PACKAGE_kmod-crypto-lib-chacha20=y" >> openwrt/.config
          echo "CONFIG_PACKAGE_kmod-crypto-lib-chacha20poly1305=y" >> openwrt/.config
          echo "CONFIG_PACKAGE_kmod-crypto-chacha20poly1305=y" >> openwrt/.config
          echo "CONFIG_PACKAGE_kmod-amneziawg=y" >> openwrt/.config
          echo "CONFIG_PACKAGE_amneziawg-go=y" >> openwrt/.config
          echo "CONFIG_PACKAGE_amneziawg-tools=y" >> openwrt/.config

          # amneziawg-go needs Go >= 1.25; OpenWrt 24.10 ships an older golang feed.
          case "${{ inputs.openwrt_version }}" in
            24.10*)
              rm -r openwrt/feeds/packages/lang/golang
              cp -r packages/lang/golang openwrt/feeds/packages/lang
              ;;
          esac

          ./openwrt/scripts/feeds install -a
          make -C openwrt defconfig

      - name: Compile AmneziaWG packages
        run: |
          set -e -x
          cd openwrt
          make package/kmod-amneziawg/{clean,download,prepare,compile} -j "$(nproc)"
          make package/amneziawg-go/{clean,download,prepare,compile} -j "$(nproc)"
          make package/amneziawg-tools/{clean,download,prepare,compile} -j "$(nproc)"

      - name: Prepare artifacts
        run: |
          set -e -x
          mkdir awgrelease

          pkg_dir="$(find openwrt/bin/packages -mindepth 2 -maxdepth 2 -type d -name awgopenwrt -print -quit)"
          if [ -z "$pkg_dir" ]; then
            echo "No AmneziaWG packages were built below openwrt/bin/packages."
            exit 1
          fi
          arch="$(basename "$(dirname "$pkg_dir")")"
          echo "OPENWRT_ARCH=$arch" >> "$GITHUB_ENV"

          find "$pkg_dir" \
            -maxdepth 1 -type f \( -name 'amneziawg-go*' -o -name 'amneziawg-tools*' \) \
            \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} awgrelease \;
          find "openwrt/bin/targets/${{ inputs.openwrt_target }}/${{ inputs.openwrt_subtarget }}/packages" \
            -maxdepth 1 -type f -name 'kmod-amneziawg*' \( -name '*.ipk' -o -name '*.apk' \) \
            -exec cp {} awgrelease \;

          for pkg in kmod-amneziawg amneziawg-go amneziawg-tools; do
            ls awgrelease | grep -q "^${pkg}[-_]" || { echo "Package ${pkg} is missing."; exit 1; }
          done

          openwrt_ver="${{ inputs.openwrt_version }}"
          target="${{ inputs.openwrt_target }}"
          subtarget="${{ inputs.openwrt_subtarget }}"

          # tools/go: amneziawg-go_3.0.1-1_<arch>.ipk
          #        -> amneziawg-go_3.0.1-1_openwrt_<arch>.ipk
          for f in awgrelease/amneziawg-go_* awgrelease/amneziawg-tools_*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            ext="${base##*.}"
            new=$(printf '%s\n' "$base" | sed -E "s/_${arch}\\.${ext}\$/_openwrt_${arch}.${ext}/")
            if [ "$base" != "$new" ]; then
              mv "awgrelease/$base" "awgrelease/$new"
            fi
          done

          # kmod: kmod-amneziawg_3.0.1-1_<arch>.ipk
          #    -> kmod-amneziawg_3.0.1-1_<openwrt>_<arch>_<target>_<subtarget>.ipk
          for f in awgrelease/kmod-amneziawg*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            ext="${base##*.}"
            new=$(printf '%s\n' "$base" | sed -E "s/_${arch}\\.${ext}\$/_${openwrt_ver}_${arch}_${target}_${subtarget}.${ext}/")
            if [ "$base" != "$new" ]; then
              mv "awgrelease/$base" "awgrelease/$new"
            fi
          done

          vermagic="$(find openwrt/build_dir -maxdepth 4 -type f -name vermagic -print -quit)"
          {
            echo "AmneziaWG version: ${{ inputs.amneziawg_version }}"
            echo "OpenWrt version: ${openwrt_ver}"
            echo "Target: ${target}/${subtarget}"
            echo "Architecture: $arch"
            echo "Built at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Vermagic: $([ -n "$vermagic" ] && cat "$vermagic" || echo 'unknown')"
          } > "awgrelease/build-info_${openwrt_ver}_${target}_${subtarget}_${arch}.txt"

          ls -la awgrelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ inputs.openwrt_version }}-${{ inputs.openwrt_target }}-${{ inputs.openwrt_subtarget }}-${{ env.OPENWRT_ARCH }}
          path: awgrelease/*
          if-no-files-found: error
