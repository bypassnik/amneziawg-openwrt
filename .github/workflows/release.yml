name: Release - Build AmneziaWG for OpenWrt 24.10 and 25.12
# Touch: re-register workflow after enabling Actions

# Builds amneziawg-tools, amneziawg-go and kmod-amneziawg for every target in
# .github/targets.json against the latest patch releases of OpenWrt 24.10.x
# (.ipk) and 25.12.x (.apk), then attaches the individual packages to a GitHub
# Release (no LuCI, no SNAPSHOT, no tar.gz of binaries).

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      amneziawg_version:
        description: "Release tag, branch or commit hash to build"
        type: string
        required: true
        default: "master"
      openwrt_24_10:
        description: "OpenWrt 24.10.x release, or `latest`"
        type: string
        required: true
        default: "latest"
      openwrt_25_12:
        description: "OpenWrt 25.12.x release, or `latest`"
        type: string
        required: true
        default: "latest"
      publish:
        description: "Attach the packages to the release named after the built version"
        type: boolean
        required: true
        default: false
      draft:
        description: "Create the release as a draft, if it does not exist yet"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve build parameters
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.params.outputs.targets }}
      openwrt_versions: ${{ steps.params.outputs.openwrt_versions }}
      amneziawg_version: ${{ steps.params.outputs.amneziawg_version }}
      publish: ${{ steps.params.outputs.publish }}
      draft: ${{ steps.params.outputs.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve parameters
        id: params
        run: |
          set -e -o pipefail

          echo "targets=$(jq -c . .github/targets.json)" >> "$GITHUB_OUTPUT"

          resolve_series() {
            local series="$1"
            local requested="$2"
            if [ "$requested" != "latest" ]; then
              printf '%s\n' "$requested"
              return
            fi
            curl -fsS https://downloads.openwrt.org/releases/ \
              | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
              | grep -E "^${series}\\." \
              | sort -V \
              | tail -n1
          }

          # TEMP smoke-test: only OpenWrt 24.10 (+ targets.json = x86/64).
          # Restore 25.12 in the matrix after amneziawg-go on 24.10 is green.
          if [ "${{ github.event_name }}" = "push" ]; then
            v24=$(resolve_series "24.10" "latest")
            echo "amneziawg_version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          else
            v24=$(resolve_series "24.10" "${{ inputs.openwrt_24_10 }}")
            echo "amneziawg_version=${{ inputs.amneziawg_version }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ inputs.draft }}" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$v24" ]; then
            echo "Unable to resolve OpenWrt 24.10 version."
            exit 1
          fi

          echo "Resolved OpenWrt versions (smoke-test): $v24"
          echo "openwrt_versions=$(jq -nc --arg a "$v24" '[$a]')" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        openwrt_version: ${{ fromJSON(needs.prepare.outputs.openwrt_versions) }}
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    uses: ./.github/workflows/build-packages.yml
    with:
      openwrt_version: ${{ matrix.openwrt_version }}
      amneziawg_version: ${{ needs.prepare.outputs.amneziawg_version }}
      openwrt_target: ${{ matrix.target.target }}
      openwrt_subtarget: ${{ matrix.target.subtarget }}
      artifact_prefix: amneziawg

  publish:
    name: Publish release
    needs: [ prepare, build ]
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect packages
        run: |
          set -e -x
          mkdir dist
          find artifacts -type f \( -name '*.ipk' -o -name '*.apk' -o -name 'build-info_*.txt' \) \
            -exec cp -n {} dist/ \;
          ls -la dist
          test "$(find dist -type f | wc -l)" -gt 0

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.amneziawg_version }}
          OPENWRT_VERSIONS: ${{ needs.prepare.outputs.openwrt_versions }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
        run: |
          set -e
          if view_error="$(gh release view "$TAG" 2>&1 >/dev/null)"; then
            echo "Adding packages to the existing release $TAG."
            gh release upload "$TAG" dist/* --clobber
            exit 0
          elif ! printf '%s' "$view_error" | grep -qi 'release not found'; then
            echo "Unable to look up the release $TAG: $view_error"
            exit 1
          fi

          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Refusing to create a release for '$TAG', which is not a tag."
            echo "Tag the commit first, or re-run with an existing release tag."
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > generated-notes.md || true

          {
            printf 'Пакеты собраны против OpenWrt %s.\n\n' "$OPENWRT_VERSIONS"
            printf 'В релизе отдельные файлы `.ipk` (24.10.x) и `.apk` (25.12.x):\n'
            printf '- `amneziawg-tools_*_openwrt_<arch>.{ipk,apk}`\n'
            printf '- `amneziawg-go_*_openwrt_<arch>.{ipk,apk}`\n'
            printf '- `kmod-amneziawg_*_<openwrt>_<arch>_<target>_<subtarget>.{ipk,apk}`\n\n'
            printf 'LuCI-пакеты не публикуются. Установка — через `opkg`/`apk`, см. README.\n\n'
            cat generated-notes.md
          } > notes.md

          echo "Creating release $TAG."
          gh release create "$TAG" dist/* \
            --title "AmneziaWG OpenWrt $TAG" \
            --notes-file notes.md \
            $([ "$DRAFT" = "true" ] && echo --draft)
